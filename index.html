<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Full-screen phone web app: edge to edge under the notch and home indicator (the HUD keeps to the safe areas,
         ui/mobile.css), no page zoom, launched from the home screen without browser bars (manifest, apple-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BloomGrid" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="theme-color" content="#061315" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>BloomGrid</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%2367d39a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffcf6a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- First paint before any script or stylesheet: the welcome screen's night sea (D-148). -->
    <style>
      html,
      body {
        margin: 0;
        background: radial-gradient(ellipse at 50% 45%, #0c2c33 0%, #061719 45%, #020a0c 100%) #020a0c;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="boot"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
